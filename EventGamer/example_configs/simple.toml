[sip]
server = "fritz.box"
username = "sipphonetest"
# Relative to this config file. Copy sip-password.txt.example and edit it.
password_file = "sipphonetest_password.txt"

[audio]
# Relative paths are resolved against this configuration file's directory.
in_queue = "audio/in_queue.wav"
queue_press_key = "audio/queue_press_key.wav"
game_starts = "audio/game_starts.wav"
game_over = "audio/game_over.wav"
digit_0 = "audio/digit_0.wav"
digit_1 = "audio/digit_1.wav"
digit_2 = "audio/digit_2.wav"
digit_3 = "audio/digit_3.wav"
digit_4 = "audio/digit_4.wav"
digit_5 = "audio/digit_5.wav"
digit_6 = "audio/digit_6.wav"
digit_7 = "audio/digit_7.wav"
digit_8 = "audio/digit_8.wav"
digit_9 = "audio/digit_9.wav"

[osc]
address_family = "ipv4"
bind_host = "0.0.0.0"
bind_port = 9000
remote_host = "127.0.0.1"
remote_port = 9001
