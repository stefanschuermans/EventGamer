[sip]
server = "fritz.box"
username = "sipphonetest"
# Relative to this config file. Copy sip-password.txt.example and edit it.
password_file = "sipphonetest_password.txt"

[audio]
# Relative paths are resolved against this configuration file's directory.
in_queue = "audio/in_queue.wav"
